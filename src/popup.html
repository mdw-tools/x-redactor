<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 260px; margin: 0; padding: 14px 16px; font: 13px/1.4 system-ui, sans-serif; }
      h1 { font-size: 15px; margin: 0 0 12px; }
      fieldset { border: 0; margin: 0 0 12px; padding: 0; }
      fieldset:disabled { opacity: 0.5; }
      legend { font-weight: 600; margin-bottom: 4px; padding: 0; }
      label { display: block; margin: 3px 0; }
      select { width: 100%; }
      .toggle { font-weight: 600; margin-bottom: 12px; }
      a { color: #1d9bf0; }
    </style>
  </head>
  <body>
    <h1>X Redactor</h1>
    <label class="toggle"><input type="checkbox" id="enabled" /> Enabled</label>
    <fieldset id="options">
      <fieldset>
        <legend>When a post has profanity</legend>
        <label><input type="radio" name="mode" value="censor" /> Censor the words</label>
        <label><input type="radio" name="mode" value="collapse" /> Collapse the post (click to show)</label>
        <label><input type="radio" name="mode" value="remove" /> Remove the post</label>
      </fieldset>
      <fieldset>
        <legend>Censor style</legend>
        <select id="style">
          <option value="first">f***</option>
          <option value="stars">****</option>
          <option value="grawlix">#$@&amp;</option>
        </select>
      </fieldset>
      <a href="#" id="edit-words">Edit word list…</a>
    </fieldset>
    <script src="lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
